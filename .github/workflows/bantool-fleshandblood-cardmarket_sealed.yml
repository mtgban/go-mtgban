name: fleshandblood / cardmarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-cardmarket_sealed, fleshandblood-all]
  schedule:
    - cron: "33 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket_sealed
      game: "fleshandblood"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
