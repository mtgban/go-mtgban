name: tcg_lastsold_yugioh

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [tcg_lastsold_yugioh]
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: ${{ github.workflow }}
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
