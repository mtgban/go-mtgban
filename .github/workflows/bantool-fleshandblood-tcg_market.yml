name: fleshandblood / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-tcg_market, fleshandblood-all]
  schedule:
    - cron: "19 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_market
      game: "fleshandblood"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
