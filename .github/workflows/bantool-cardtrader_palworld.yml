name: palworld / cardtrader

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardtrader_palworld]
  schedule:
    - cron: "44 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardtrader_palworld
      game: "palworld"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/palworld/palworld.json.xz
    secrets: inherit
