name: riftbound / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [miniaturemarket_sealed_riftbound]
  schedule:
    - cron: "40 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: miniaturemarket_sealed_riftbound
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
