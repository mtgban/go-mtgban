name: riftbound / vegassingles

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [vegassingles_riftbound]
  schedule:
    - cron: "7 20 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: vegassingles_riftbound
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
