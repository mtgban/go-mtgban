name: magic / sealed_ev

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [sealed_ev]
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore]
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: sealed_ev
      game: "magic"
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
      # Every run of this one lands between two and three hours: it prices
      # each sealed product from the singles inside it.
      timeout-minutes: 240
    secrets: inherit
