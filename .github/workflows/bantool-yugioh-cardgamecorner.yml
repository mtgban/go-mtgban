name: yugioh / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [yugioh-cardgamecorner, yugioh-all]
  schedule:
    - cron: "59 19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
