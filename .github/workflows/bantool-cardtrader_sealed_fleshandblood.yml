name: fleshandblood / cardtrader_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardtrader_sealed_fleshandblood]
  schedule:
    - cron: "16 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardtrader_sealed_fleshandblood
      game: "fleshandblood"
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
