name: yugioh / tcg_index

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [yugioh-tcg_index, yugioh-all]
  schedule:
    - cron: "50 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_index
      game: "yugioh"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
