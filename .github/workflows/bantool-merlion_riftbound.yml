name: riftbound / merlion

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [merlion_riftbound]
  schedule:
    - cron: "22 */12 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: merlion_riftbound
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
