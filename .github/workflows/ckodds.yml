name: magic / ckodds

# The odds mtgban-website's Card Kingdom tooltips quote, measured every day
# from the newspaper's history of CK's price list (cmd/ckodds) and published
# next to the datastore, where the site reads them.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
    secrets: inherit

  ckodds:
    needs: [cache-datastore]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: cmd/ckodds/go.mod
          cache-dependency-path: cmd/ckodds/go.sum

      - name: Cache Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ needs.cache-datastore.outputs.key }}
          fail-on-cache-miss: true

      - name: Build ckodds
        run: |
          cd cmd/ckodds
          go install

      - name: Run ckodds
        env:
          NEWSPAPER_SQL_LINE: "${{ secrets.NEWSPAPER_SQL_LINE }}"
          B2_APPLICATION_KEY_ID_DATASTORE: "${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}"
          B2_APPLICATION_KEY_DATASTORE: "${{ secrets.B2_APPLICATION_KEY_DATASTORE }}"
        run: |
          ckodds -datastore ${{ needs.cache-datastore.outputs.filepath }} \
                 -output b2://mtgban-datastore/magic/ck-odds-v2.json.xz
