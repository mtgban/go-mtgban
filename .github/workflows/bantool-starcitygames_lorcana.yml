name: lorcana / starcitygames

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [starcitygames_lorcana]
  schedule:
    - cron: "32 2,14 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-starcitygames
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: starcitygames_lorcana
      game: "lorcana"
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
