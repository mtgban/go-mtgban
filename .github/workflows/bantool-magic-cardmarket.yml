name: magic / cardmarket

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [magic-cardmarket, magic-all]
  schedule:
    - cron: "58 5,17 * * *"

permissions:
  contents: read

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore]
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket
      game: "magic"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
      cardmarket-catalog-filepath: b2://mtgban-datastore/magic/cardmarket_catalog.json.xz
    secrets: inherit
