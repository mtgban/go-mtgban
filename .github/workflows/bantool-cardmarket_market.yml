name: magic / cardmarket_market

# No schedule yet: even filtered (BAN_API_KEY), Magic's catalog can run up
# to 12h, and picking a cron time that doesn't collide with the rest of the
# bantool-cardmarket group's own schedule is a separate decision from
# whether a runner exists to run it on at all. Routed to the self-hosted
# cardmarket-market runner below - see .github/runner/README.md - so the
# 12h ceiling itself is no longer the blocker; dispatch this by hand
# (bantool's own -TargetEdition flag smoke-tests a slice of the catalog)
# until a schedule is picked.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_market]

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  cache-mkmids:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.MKMIDS_MAGIC }}
      path: "datastore/"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore, cache-mkmids]
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_market
      game: "magic"
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
      mkmids-filepath: ${{ needs.cache-mkmids.outputs.filepath }}
      mkmids-cache-key: ${{ needs.cache-mkmids.outputs.key }}
      runs-on: '["self-hosted", "cardmarket-market"]'
    secrets: inherit
