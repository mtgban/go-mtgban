name: magic / cardmarket_market

# The full run measured 10h50 on the cardmarket-market runner. This slot
# follows the four shorter Market jobs already scheduled at 07:10, 08:25,
# 09:40 and 10:55 UTC; all five share the concurrency group below, so a
# slow run queues the next one instead of starting a second catalog walk;
# the later Pokemon and YuGiOh jobs use the same group too.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_market]
  schedule:
    - cron: "10 19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  # No cache-datastore/cache-mkmids jobs here, unlike the Index workflow
  # this was copied from: actions/cache cannot restore on this job's own
  # self-hosted runner an entry a GitHub-hosted job saved (a real, documented
  # gap, not a flake - confirmed live, twice, against this exact key). Both
  # files are read live over HTTPS instead, straight from the same
  # DATASTORE_MAGIC/MKMIDS_MAGIC variables the Index workflow's
  # cache-datastore/cache-mkmids jobs download from - simplecloud.Open
  # supports that scheme directly, no staging required. AllPrintings.json.xz
  # happens to already be mirrored into B2 by that Index workflow's own
  # cache-datastore job, but this one has no reason to depend on that
  # mirror existing when the same variable already names where to read it
  # from directly.
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_market
      game: "magic"
      datastore-filepath: ${{ vars.DATASTORE_MAGIC }}
      mkmids-filepath: ${{ vars.MKMIDS_MAGIC }}
      runs-on: '["self-hosted", "cardmarket-market"]'
    secrets: inherit
