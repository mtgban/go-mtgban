name: fleshandblood / starcitygames

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-starcitygames, fleshandblood-all]
  schedule:
    - cron: "6 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-starcitygames
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: starcitygames
      game: "fleshandblood"
      affiliate: ${{ vars.SCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
