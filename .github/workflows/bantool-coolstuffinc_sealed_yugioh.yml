name: yugioh / coolstuffinc_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [coolstuffinc_sealed_yugioh]
  schedule:
    - cron: "28 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: coolstuffinc_sealed_yugioh
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
