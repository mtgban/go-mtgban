name: gundam / coolstuffinc

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [gundam-coolstuffinc, gundam-all]
  schedule:
    - cron: "2 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: coolstuffinc
      game: "gundam"
      affiliate: ${{ vars.CSI_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/gundam/gundam.json.xz
    secrets: inherit
