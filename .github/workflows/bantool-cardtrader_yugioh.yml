name: yugioh / cardtrader

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardtrader_yugioh]
  schedule:
    - cron: "45 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardtrader_yugioh
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
