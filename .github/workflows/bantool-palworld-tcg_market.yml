name: palworld / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [palworld-tcg_market, palworld-all]
  schedule:
    - cron: "10 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_market
      game: "palworld"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/palworld/palworld.json.xz
    secrets: inherit
