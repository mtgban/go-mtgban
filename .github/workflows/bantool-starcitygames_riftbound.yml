name: riftbound / starcitygames

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [starcitygames_riftbound]
  schedule:
    - cron: "40 1-23/12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-starcitygames
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: starcitygames_riftbound
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
