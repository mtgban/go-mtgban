name: pokemon / cardmarket_market

# The full run measured 3h12 on the cardmarket-market runner. It follows
# Magic's measured 10h50 slot, with the shared concurrency group below
# providing a second guard against overlap if either run overruns.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_market_pokemon]
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_market_pokemon
      game: "pokemon"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
      mkmids-filepath: b2://mtgban-datastore/pokemon/cardmarket_catalog.json.xz
      runs-on: '["self-hosted", "cardmarket-market"]'
    secrets: inherit
