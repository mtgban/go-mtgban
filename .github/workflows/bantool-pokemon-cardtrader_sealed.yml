name: pokemon / cardtrader_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [pokemon-cardtrader_sealed, pokemon-all]
  schedule:
    - cron: "54 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardtrader_sealed
      game: "pokemon"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
