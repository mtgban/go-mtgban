name: fleshandblood / starcitygames_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-starcitygames_sealed, fleshandblood-all]
  schedule:
    - cron: "3 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-starcitygames
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: starcitygames_sealed
      game: "fleshandblood"
      affiliate: ${{ vars.SCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
