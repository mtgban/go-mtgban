name: pokemon / strikezone

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [strikezone_pokemon]
  schedule:
    - cron: "25 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-strikezone
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: strikezone_pokemon
      game: "pokemon"
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
