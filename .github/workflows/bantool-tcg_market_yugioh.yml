name: yugioh / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [tcg_market_yugioh]
  schedule:
    - cron: "30 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: tcg_market_yugioh
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
