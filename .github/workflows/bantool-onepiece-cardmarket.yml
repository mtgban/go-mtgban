name: onepiece / cardmarket

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-cardmarket, onepiece-all]
  schedule:
    - cron: "44 9,21 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket
      game: "onepiece"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
      cardmarket-catalog-filepath: b2://mtgban-datastore/onepiece/cardmarket_catalog.json.xz
    secrets: inherit
