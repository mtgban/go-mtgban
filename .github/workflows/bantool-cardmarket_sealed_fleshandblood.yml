name: fleshandblood / cardmarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_sealed_fleshandblood]
  schedule:
    - cron: "33 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_sealed_fleshandblood
      game: "fleshandblood"
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
