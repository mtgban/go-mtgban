name: onepiece / cardtrader

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-cardtrader, onepiece-all]
  schedule:
    - cron: "4 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardtrader
      game: "onepiece"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
