name: lorcana / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-cardgamecorner, lorcana-all]
  schedule:
    - cron: "19 20 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "lorcana"
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
