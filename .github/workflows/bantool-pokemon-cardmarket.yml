name: pokemon / cardmarket

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [pokemon-cardmarket, pokemon-all]
  schedule:
    - cron: "1 1,13 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket
      game: "pokemon"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
      cardmarket-catalog-filepath: b2://mtgban-datastore/pokemon/cardmarket_catalog.json.xz
    secrets: inherit
