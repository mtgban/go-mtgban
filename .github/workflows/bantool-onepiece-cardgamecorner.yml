name: onepiece / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-cardgamecorner, onepiece-all]
  schedule:
    - cron: "9 20 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "onepiece"
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
