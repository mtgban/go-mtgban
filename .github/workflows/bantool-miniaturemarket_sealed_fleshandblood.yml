name: fleshandblood / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [miniaturemarket_sealed_fleshandblood]
  schedule:
    - cron: "20 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: miniaturemarket_sealed_fleshandblood
      game: "fleshandblood"
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
