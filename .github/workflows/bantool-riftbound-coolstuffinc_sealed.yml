name: riftbound / coolstuffinc_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-coolstuffinc_sealed, riftbound-all]
  schedule:
    - cron: "12 2,14 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: coolstuffinc_sealed
      game: "riftbound"
      affiliate: ${{ vars.CSI_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
