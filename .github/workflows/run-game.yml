name: Run game workflows

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A workflow belongs to a game through its "<game> / <target>" name,
      # so the name line is the membership list - no roster to keep in sync.
      - name: Trigger every workflow of the game
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ inputs.game }}
        run: |
          status=0
          for file in .github/workflows/bantool-*.yml; do
            if ! grep -q "^name: $GAME /" "$file"; then
              continue
            fi
            echo "Triggering $(basename "$file")"
            gh workflow run "$(basename "$file")" || status=1
          done
          exit $status
