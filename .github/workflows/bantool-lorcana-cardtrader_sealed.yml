name: lorcana / cardtrader_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-cardtrader_sealed, lorcana-all]
  schedule:
    - cron: "28 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardtrader_sealed
      game: "lorcana"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
