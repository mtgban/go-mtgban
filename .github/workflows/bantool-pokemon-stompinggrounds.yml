name: pokemon / stompinggrounds

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [pokemon-stompinggrounds, pokemon-all]
  schedule:
    - cron: "30 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-stompinggrounds
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: stompinggrounds
      game: "pokemon"
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
