name: pokemon / strikezone

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [pokemon-strikezone, pokemon-all]
  schedule:
    - cron: "8 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-strikezone
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: strikezone
      game: "pokemon"
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
