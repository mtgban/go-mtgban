name: Cache a file from the datastore bucket

# Every datastore but Magic's is built by github.com/mtgban/datastore-gen and
# published straight to the private bucket, with no public URL for
# cache-file.yml to curl, so it is pulled from there and cached under the
# same key and filepath contract.

on:
  workflow_call:
    inputs:
      uri:
        description: "The b2:// object to cache"
        required: true
        type: string
    outputs:
      key:
        description: "Key of the cache to retrieve"
        value: ${{ jobs.cache-b2.outputs.key }}
      filepath:
        description: "Where the file will be available at"
        value: ${{ jobs.cache-b2.outputs.filepath }}

permissions:
  contents: read

jobs:
  cache-b2:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_key.outputs.key }}
      filepath: ${{ steps.get_key.outputs.filepath }}
    env:
      B2_URI: "${{ inputs.uri }}"
      B2_APPLICATION_KEY_ID: "${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}"
      B2_APPLICATION_KEY: "${{ secrets.B2_APPLICATION_KEY_DATASTORE }}"
    steps:
      - name: Fetch file checksum
        id: get_key
        run: |
          set -o pipefail
          pipx install b2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          base=$(basename "$B2_URI" .xz)
          # B2 serves no HTTP etag, so the object's own metadata stands in:
          # it carries the file id, sha1 and upload timestamp, all of which
          # change when the datastore is republished
          etag=$(b2 file info "$B2_URI" | sha1sum | cut -c 1-16)
          echo "key=$base-$etag" >> "$GITHUB_OUTPUT"
          echo "filepath=datastore/$base" >> "$GITHUB_OUTPUT"

      - name: Cache path
        id: cache_file
        uses: actions/cache@v6
        with:
          path: "datastore/"
          key: ${{ steps.get_key.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p datastore/
          b2 file download --no-progress "$B2_URI" "${{ steps.get_key.outputs.filepath }}.xz"
          xz -d "${{ steps.get_key.outputs.filepath }}.xz"
