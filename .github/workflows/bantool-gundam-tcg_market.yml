name: gundam / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [gundam-tcg_market, gundam-all]
  schedule:
    - cron: "10 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_market
      game: "gundam"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/gundam/gundam.json.xz
    secrets: inherit
