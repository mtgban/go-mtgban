name: Run bantool

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      game:
        required: true
        type: string
      datastore-filepath:
        required: true
        type: string
      # Left empty when datastore-filepath is remote (a b2:// path bantool
      # reads directly), which needs no cached download.
      datastore-cache-key:
        required: false
        type: string
      skus-filepath:
        type: string
      skus-cache-key:
        type: string
      # The Cardmarket id map (MTGJSON's for Magic, the catalog publisher's
      # for the rest); replaces the API crawl when given.
      mkmids-filepath:
        type: string
      mkmids-cache-key:
        type: string

permissions:
  contents: read

jobs:
  run-bantool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check IP
        run: echo "Runner IP - $(curl https://api.ipify.org 2> /dev/null)"

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Show Go version
        run: go version

      - if: ${{ inputs.datastore-cache-key }}
        name: Cache Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ inputs.datastore-cache-key }}
          fail-on-cache-miss: true

      - if: ${{ inputs.skus-cache-key }}
        name: Cache Skus
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ inputs.skus-cache-key }}
          fail-on-cache-miss: true

      - if: ${{ inputs.mkmids-cache-key }}
        name: Cache Cardmarket id map
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ inputs.mkmids-cache-key }}
          fail-on-cache-miss: true

      - name: Build bantool
        run: |
          cd cmd/bantool
          go install

      - name: Run bantool
        id: run_bantool
        env:
          CK_PARTNER: "${{ vars.CK_PARTNER }}"
          CSI_PARTNER: "${{ vars.CSI_PARTNER }}"
          CT_PARTNER: "${{ vars.CT_PARTNER }}"
          MINT_PARTNER: "${{ vars.MINT_PARTNER }}"
          MP_PARTNER: "${{ vars.MP_PARTNER }}"
          SCG_PARTNER: "${{ vars.SCG_PARTNER }}"
          TCG_PARTNER: "${{ vars.TCG_PARTNER }}"
          MAX_CONCURRENCY: "${{ vars.MAX_CONCURRENCY }}"

          MTGJSON_TCGSKU_PATH: "${{ inputs.skus-filepath }}"
          MTGJSON_MKMID_PATH: "${{ inputs.mkmids-filepath }}"
          # The catalog dump is published beside every game's datastore, on
          # the same schedule, and names the product each sku belongs to.
          TCGPLAYER_CATALOG_PATH: "b2://mtgban-datastore/${{ inputs.game }}/tcgplayer-catalog.json.xz"

          B2_APP_KEY: "${{ secrets.B2_APP_KEY }}"
          B2_KEY_ID: "${{ secrets.B2_KEY_ID }}"
          # Reading a datastore straight from its bucket (b2:// filepath)
          # needs the datastore key; the output key above cannot read it.
          B2_APP_KEY_DATASTORE: "${{ secrets.B2_APP_KEY_DATASTORE }}"
          B2_KEY_ID_DATASTORE: "${{ secrets.B2_KEY_ID_DATASTORE }}"
          BAN_API_KEY: "${{ secrets.BAN_API_KEY }}"
          CARDTRADER_TOKEN_BEARER: "${{ secrets.CARDTRADER_TOKEN_BEARER }}"
          MKM_APP_SECRET: "${{ secrets.MKM_APP_SECRET }}"
          MKM_APP_TOKEN: "${{ secrets.MKM_APP_TOKEN }}"
          SCG_API_KEY: "${{ secrets.SCG_API_KEY }}"
          TCGPLAYER_AUTH: "${{ secrets.TCGPLAYER_AUTH }}"
          TCGPLAYER_PRIVATE_KEY: "${{ secrets.TCGPLAYER_PRIVATE_KEY }}"
          TCGPLAYER_PUBLIC_KEY: "${{ secrets.TCGPLAYER_PUBLIC_KEY }}"
        run: |
          set +e
          bantool -datastore ${{ inputs.datastore-filepath }} \
                  -output-path b2://mtgban-dumps/${{ inputs.game }}/${{ inputs.target }} \
                  -format json.xz \
                  -${{ inputs.target }}
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          set -e

          # delay failure so we can still load what succeeded
          if [[ $EXIT -eq 2 ]]; then
              exit 0
          fi
          exit $EXIT

      - name: Ping server
        env:
          BAN_SECRET: "${{ secrets.BAN_SECRET }}"
        run: |
          SIGNED_URL=$(bantool -sign http://${{ inputs.game }}.mtgban.com/api/load/${{ inputs.target }} 2> /dev/null)
          curl -L "$SIGNED_URL" 2> /dev/null | tee /dev/stderr | jq -e 'select(.status=="ok")'

      - name: Check bantool status
        if: ${{ steps.run_bantool.outputs.exit_code == '2' }}
        run: |
          echo "bantool returned exit code 2"
          exit 1
