name: onepiece / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [tcg_market_onepiece]
  schedule:
    - cron: "28 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: tcg_market_onepiece
      game: "onepiece"
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
