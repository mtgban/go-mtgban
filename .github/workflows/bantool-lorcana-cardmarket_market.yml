name: lorcana / cardmarket_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-cardmarket_market, lorcana-all]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket_market
      game: "lorcana"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
      cardmarket-catalog-filepath: b2://mtgban-datastore/lorcana/cardmarket_catalog.json.xz
    secrets: inherit
