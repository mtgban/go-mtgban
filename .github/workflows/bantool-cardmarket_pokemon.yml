name: pokemon / cardmarket

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_pokemon]
  schedule:
    - cron: "1 1,13 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_pokemon
      game: "pokemon"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
      mkmids-filepath: b2://mtgban-datastore/pokemon/cardmarket_catalog.json.xz
    secrets: inherit
