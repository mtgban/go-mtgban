name: pokemon / coolstuffinc

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [coolstuffinc_pokemon]
  schedule:
    - cron: "36 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: coolstuffinc_pokemon
      game: "pokemon"
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
