name: onepiece / tcg_index

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-tcg_index, onepiece-all]
  schedule:
    - cron: "59 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_index
      game: "onepiece"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
