name: lorcana / starcitygames_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-starcitygames_sealed, lorcana-all]
  schedule:
    - cron: "20 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-starcitygames
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: starcitygames_sealed
      game: "lorcana"
      affiliate: ${{ vars.SCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
