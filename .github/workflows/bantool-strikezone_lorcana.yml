name: strikezone_lorcana

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [strikezone_lorcana]
  schedule:
    - cron: "10 */12 * * *"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: ${{ github.workflow }}
      game: "lorcana"
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
