name: fleshandblood / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-cardgamecorner, fleshandblood-all]
  schedule:
    - cron: "39 20 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "fleshandblood"
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
