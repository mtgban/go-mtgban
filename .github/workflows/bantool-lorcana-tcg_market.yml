name: lorcana / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-tcg_market, lorcana-all]
  schedule:
    - cron: "29 1,13 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_market
      game: "lorcana"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
