name: pokemon / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [pokemon-cardgamecorner, pokemon-all]
  schedule:
    - cron: "49 19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "pokemon"
      datastore-filepath: b2://mtgban-datastore/pokemon/pokemon.json.xz
    secrets: inherit
