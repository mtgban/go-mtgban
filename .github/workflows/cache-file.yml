name: Download and cache a file

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Where to download from"
        required: true
        type: string
      path:
        description: "Where to download to"
        required: true
        type: string
        default: "datastore/"
      game:
        description: "If set, where to save the result and ping to"
        type: string

  workflow_call:
    inputs:
      url:
        required: true
        type: string
      path:
        required: true
        type: string
      game:
        type: string
    outputs:
      key:
        description: "Key of the cache to retrieve"
        value: ${{ jobs.cache-file.outputs.key }}
      filepath:
        description: "Where the file will be availble at"
        value: ${{ jobs.cache-file.outputs.filepath }}

permissions:
  contents: read

jobs:
  cache-file:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_etag.outputs.key }}
      filepath: ${{ steps.get_etag.outputs.filepath }}
    steps:
      - name: Fetch file checksum
        id: get_etag
        run: |
          etag=$(curl -sI "${{ inputs.url }}" | grep -i etag | tr -d '\r"' | cut -f 2 -d " ")
          base=$(basename "${{ inputs.url }}" | cut -d? -f1)
          key=$base-$etag
          filepath=${{ inputs.path }}$base
          echo "key=$key" >> $GITHUB_OUTPUT
          echo "filepath=$filepath" >> $GITHUB_OUTPUT

      - name: Cache path
        id: cache_file
        uses: actions/cache@v5
        with:
          path: ${{ inputs.path }}
          key: ${{ steps.get_etag.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p "${{ inputs.path }}"
          curl -L "${{ inputs.url }}" -o "${{ steps.get_etag.outputs.filepath }}"

      - if: steps.cache_file.outputs.cache-hit != 'true' && inputs.game != ''
        name: Upload to B2
        env:
          B2KEY: "${{ secrets.B2_KEY_ID_DATASTORE }}"
          B2SECRET: "${{ secrets.B2_APP_KEY_DATASTORE }}"
        run: |
          pipx install b2
          b2 account authorize $B2KEY $B2SECRET
          b2 sync --skip-newer "${{ inputs.path }}" "b2://mtgban-datastore/${{ inputs.game }}"
          b2 account clear

      # A pull request must not tell the live site to reload: the reload is a
      # production side effect, and answering it takes the site long enough
      # that a proposed change would be failing on the server's health rather
      # than on its own. Master still pings on the very same cache miss - a
      # cache written on a pull request is scoped to that pull request, so the
      # push and the nightly schedule both miss again and ping for real.
      - if: steps.cache_file.outputs.cache-hit != 'true' && inputs.game != '' && github.event_name != 'pull_request'
        name: Ping server
        env:
          BAN_SECRET: "${{ secrets.BAN_SECRET }}"
          GAME: "${{ inputs.game }}"
        run: |
          # Each attempt signs a timestamp of its own. The signature covers
          # the timestamp, so a retry that reused the first one would be
          # refused as a replay rather than served.
          for attempt in 1 2 3; do
            rm -f ping-response
            ts=$(date -u +%s)
            body=$(jq -n --arg ts "$ts" '{ts:($ts|tonumber)}')
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$BAN_SECRET" -binary | base64)

            code=$(curl -sS -L -X POST \
                -H 'Content-Type: application/json' \
                -H "X-Signature: $sig" \
                -H "X-Timestamp: $ts" \
                --data-raw "$body" \
                --connect-timeout 30 --max-time 900 \
                -o ping-response -w '%{http_code}' \
                "https://$GAME.mtgban.com/api/load/datastore") || code=000

            echo "attempt $attempt: HTTP $code"
            head -c 2000 ping-response 2>/dev/null || true; echo

            if [ "$code" = "200" ] && jq -e 'select(.status=="ok")' ping-response > /dev/null 2>&1; then
              exit 0
            fi

            if [ "$attempt" != "3" ]; then
              sleep 60
            fi
          done

          # Say what the server answered. Handing an HTML error page to jq
          # reports a parse error, which reads like a broken build rather
          # than the outage it is.
          echo "::error::$GAME.mtgban.com did not reload the datastore after 3 attempts (last status ${code:-none}); the upload to B2 succeeded, so re-run this job once the site is answering"
          exit 1
