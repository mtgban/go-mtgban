name: riftbound / cardgamecorner

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-cardgamecorner, riftbound-all]
  schedule:
    - cron: "29 20 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardgamecorner
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardgamecorner
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
