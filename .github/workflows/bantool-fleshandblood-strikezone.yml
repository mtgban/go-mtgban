name: fleshandblood / strikezone

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-strikezone, fleshandblood-all]
  schedule:
    - cron: "0 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-strikezone
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: strikezone
      game: "fleshandblood"
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
