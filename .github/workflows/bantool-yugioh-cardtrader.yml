name: yugioh / cardtrader

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [yugioh-cardtrader, yugioh-all]
  schedule:
    - cron: "3 10,22 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardtrader
      game: "yugioh"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
