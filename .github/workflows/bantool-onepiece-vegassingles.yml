name: onepiece / vegassingles

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-vegassingles, onepiece-all]
  schedule:
    - cron: "34 4,16 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-vegassingles
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: vegassingles
      game: "onepiece"
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
