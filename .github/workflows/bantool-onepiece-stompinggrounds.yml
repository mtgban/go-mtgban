name: onepiece / stompinggrounds

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-stompinggrounds, onepiece-all]
  schedule:
    - cron: "25 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-stompinggrounds
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: stompinggrounds
      game: "onepiece"
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
