name: gundam / cardmarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [gundam-cardmarket_sealed, gundam-all]
  schedule:
    - cron: "26 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket_sealed
      game: "gundam"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/gundam/gundam.json.xz
    secrets: inherit
