name: onepiece / cardmarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [onepiece-cardmarket_sealed, onepiece-all]
  schedule:
    - cron: "46 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardmarket_sealed
      game: "onepiece"
      affiliate: ${{ vars.MKM_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
