name: Run CI

on:
  workflow_dispatch: {}
  push: {}
  pull_request: {}
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read no datastore, so they run on their own and
  # report in seconds rather than behind the four cache jobs.
  style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.13.0 \
            -set_exit_status -config .revive.toml ./...

  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_MAGIC }}
      path: "datastore/"
      game: "magic"
    secrets: inherit

  # Lorcana is built by github.com/mtgban/lorcana-datastore and published
  # straight to the private bucket, like Riftbound below.
  cache-lorcana:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_key.outputs.key }}
      filepath: ${{ steps.get_key.outputs.filepath }}
    env:
      B2_URI: "b2://mtgban-datastore/lorcana/lorcana.json.xz"
      B2_APPLICATION_KEY_ID: "${{ secrets.B2_KEY_ID_DATASTORE }}"
      B2_APPLICATION_KEY: "${{ secrets.B2_APP_KEY_DATASTORE }}"
    steps:
      - name: Fetch file checksum
        id: get_key
        run: |
          pipx install b2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          base=$(basename "$B2_URI" .xz)
          # B2 serves no HTTP etag, so the object's own metadata stands in:
          # it carries the file id, sha1 and upload timestamp, all of which
          # change when the datastore is republished
          etag=$(b2 file info "$B2_URI" | sha1sum | cut -c 1-16)
          echo "key=$base-$etag" >> $GITHUB_OUTPUT
          echo "filepath=datastore/$base" >> $GITHUB_OUTPUT

      - name: Cache path
        id: cache_file
        uses: actions/cache@v5
        with:
          path: "datastore/"
          key: ${{ steps.get_key.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p datastore/
          b2 file download --no-progress "$B2_URI" "${{ steps.get_key.outputs.filepath }}.xz"
          xz -d "${{ steps.get_key.outputs.filepath }}.xz"

  # Riftbound has no public URL for cache-file.yml to curl: the file is built
  # by github.com/mtgban/riftbound-datastore and published straight to the
  # private bucket, so it is pulled from there and then cached under the same
  # key/filepath contract the other datastores use.
  cache-riftbound:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_key.outputs.key }}
      filepath: ${{ steps.get_key.outputs.filepath }}
    env:
      B2_URI: "b2://mtgban-datastore/riftbound/riftbound.json.xz"
      B2_APPLICATION_KEY_ID: "${{ secrets.B2_KEY_ID_DATASTORE }}"
      B2_APPLICATION_KEY: "${{ secrets.B2_APP_KEY_DATASTORE }}"
    steps:
      - name: Fetch file checksum
        id: get_key
        run: |
          pipx install b2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          base=$(basename "$B2_URI" .xz)
          # B2 serves no HTTP etag, so the object's own metadata stands in:
          # it carries the file id, sha1 and upload timestamp, all of which
          # change when the datastore is republished
          etag=$(b2 file info "$B2_URI" | sha1sum | cut -c 1-16)
          echo "key=$base-$etag" >> $GITHUB_OUTPUT
          echo "filepath=datastore/$base" >> $GITHUB_OUTPUT

      - name: Cache path
        id: cache_file
        uses: actions/cache@v5
        with:
          path: "datastore/"
          key: ${{ steps.get_key.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p datastore/
          b2 file download --no-progress "$B2_URI" "${{ steps.get_key.outputs.filepath }}.xz"
          xz -d "${{ steps.get_key.outputs.filepath }}.xz"

  cache-onepiece:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.get_key.outputs.key }}
      filepath: ${{ steps.get_key.outputs.filepath }}
    env:
      B2_URI: "b2://mtgban-datastore/onepiece/onepiece.json.xz"
      B2_APPLICATION_KEY_ID: "${{ secrets.B2_KEY_ID_DATASTORE }}"
      B2_APPLICATION_KEY: "${{ secrets.B2_APP_KEY_DATASTORE }}"
    steps:
      - name: Fetch file checksum
        id: get_key
        run: |
          pipx install b2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          base=$(basename "$B2_URI" .xz)
          # B2 serves no HTTP etag, so the object's own metadata stands in:
          # it carries the file id, sha1 and upload timestamp, all of which
          # change when the datastore is republished
          etag=$(b2 file info "$B2_URI" | sha1sum | cut -c 1-16)
          echo "key=$base-$etag" >> $GITHUB_OUTPUT
          echo "filepath=datastore/$base" >> $GITHUB_OUTPUT

      - name: Cache path
        id: cache_file
        uses: actions/cache@v5
        with:
          path: "datastore/"
          key: ${{ steps.get_key.outputs.key }}

      - if: steps.cache_file.outputs.cache-hit != 'true'
        name: Download file
        run: |
          mkdir -p datastore/
          b2 file download --no-progress "$B2_URI" "${{ steps.get_key.outputs.filepath }}.xz"
          xz -d "${{ steps.get_key.outputs.filepath }}.xz"

  # Every game is tested on its own, so one game's datastore drifting can no
  # longer hide the others: a red check names the game that broke. Magic
  # carries the whole tree because the scrapers and the matcher core read
  # AllPrintings and nothing else, and the other games' suites skip
  # themselves when their variable is unset.
  test-magic:
    needs: cache-datastore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Magic Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ needs.cache-datastore.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-datastore.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          ALLPRINTINGS5_PATH: "${{ github.workspace }}/datastore/allprintings5.json"
        run: |
          xz -dc ${{ needs.cache-datastore.outputs.filepath }} > datastore/allprintings5.json
          go test ./... -v

  test-lorcana:
    needs: cache-lorcana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Lorcana Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ needs.cache-lorcana.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-lorcana.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          LORCANA_PATH: "${{ github.workspace }}/${{ needs.cache-lorcana.outputs.filepath }}"
        run: |
          go test ./mtgmatcher/lorcana/... -v

  test-riftbound:
    needs: cache-riftbound
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Riftbound Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ needs.cache-riftbound.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-riftbound.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          RIFTBOUND_PATH: "${{ github.workspace }}/${{ needs.cache-riftbound.outputs.filepath }}"
        run: |
          go test ./mtgmatcher/riftbound/... -v

  test-onepiece:
    needs: cache-onepiece
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache One Piece Datastore
        uses: actions/cache/restore@v5
        with:
          path: "datastore/"
          key: ${{ needs.cache-onepiece.outputs.key }}
          fail-on-cache-miss: true

      # A red run states exactly which datastore bytes it tested against,
      # diffable against the bucket or a local build; a golden failure is
      # diagnosed by fingerprint instead of by guessing which version of a
      # datastore the run happened to hold.
      - name: Datastore fingerprint
        run: |
          sha256sum ${{ needs.cache-onepiece.outputs.filepath }}
          ls -l datastore/

      - name: Test
        env:
          ONEPIECE_PATH: "${{ github.workspace }}/${{ needs.cache-onepiece.outputs.filepath }}"
        run: |
          go test ./mtgmatcher/onepiece/... -v

  # The one check master's branch protection requires, kept as a name rather
  # than as work: it fans the per-game jobs back into a single verdict. It has
  # to run even when a dependency failed and re-read the results by hand,
  # because a required check that is merely skipped counts as passed and would
  # wave a broken tree through.
  mtgban-ci:
    needs: [style, test-magic, test-lorcana, test-riftbound, test-onepiece]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify every suite passed
        env:
          RESULTS: "${{ join(needs.*.result, ' ') }}"
          BROKEN: "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
        run: |
          echo "$RESULTS"
          if [ "$BROKEN" = "true" ]; then
            exit 1
          fi
