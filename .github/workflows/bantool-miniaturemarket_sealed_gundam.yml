name: gundam / miniaturemarket_sealed

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [miniaturemarket_sealed_gundam]
  schedule:
    - cron: "23 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-miniaturemarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: miniaturemarket_sealed_gundam
      game: "gundam"
      datastore-filepath: b2://mtgban-datastore/gundam/gundam.json.xz
    secrets: inherit
