name: yugioh / cardmarket_market

# No schedule yet - see bantool-cardmarket_market.yml's comment: this
# catalog needs the same offline pre-filter and the same self-hosted
# runner Magic and Pokemon's Market jobs are waiting on.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_market_yugioh]

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_market_yugioh
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
      mkmids-filepath: b2://mtgban-datastore/yugioh/cardmarket_catalog.json.xz
    secrets: inherit
