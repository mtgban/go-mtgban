name: yugioh / cardmarket_market

# The full run measured 1h10 on the cardmarket-market runner. This starts
# after Pokemon's measured 3h12 slot and after the 03:14 UTC go-cardmarket
# catalog dump's normal ~1h20 run, leaving the next Market jobs at 07:10
# UTC clear as well.
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [cardmarket_market_yugioh]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardmarket
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: cardmarket_market_yugioh
      game: "yugioh"
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
      mkmids-filepath: b2://mtgban-datastore/yugioh/cardmarket_catalog.json.xz
      runs-on: '["self-hosted", "cardmarket-market"]'
    secrets: inherit
