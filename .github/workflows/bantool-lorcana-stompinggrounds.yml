name: lorcana / stompinggrounds

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [lorcana-stompinggrounds, lorcana-all]
  schedule:
    - cron: "10 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-stompinggrounds
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: stompinggrounds
      game: "lorcana"
      datastore-filepath: b2://mtgban-datastore/lorcana/lorcana.json.xz
    secrets: inherit
