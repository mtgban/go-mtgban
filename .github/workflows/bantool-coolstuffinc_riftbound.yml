name: coolstuffinc_riftbound

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [coolstuffinc_riftbound]
  schedule:
    - cron: "5 */12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  cache-datastore:
    uses: ./.github/workflows/cache-file.yml
    with:
      url: ${{ vars.DATASTORE_RIFTBOUND }}
      path: "datastore/"
      game: "riftbound"
    secrets: inherit

  deploy:
    name: ${{ github.workflow }}
    needs: [cache-datastore]
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: ${{ github.workflow }}
      game: "riftbound"
      datastore-filepath: ${{ needs.cache-datastore.outputs.filepath }}
      datastore-cache-key: ${{ needs.cache-datastore.outputs.key }}
    secrets: inherit
