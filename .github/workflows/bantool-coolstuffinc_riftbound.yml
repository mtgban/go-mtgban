name: riftbound / coolstuffinc

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [coolstuffinc_riftbound]
  schedule:
    - cron: "12 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: coolstuffinc_riftbound
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
