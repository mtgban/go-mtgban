name: riftbound / stompinggrounds

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-stompinggrounds, riftbound-all]
  schedule:
    - cron: "40 7,19 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-stompinggrounds
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: stompinggrounds
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
