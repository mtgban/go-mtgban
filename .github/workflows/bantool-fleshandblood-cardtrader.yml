name: fleshandblood / cardtrader

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [fleshandblood-cardtrader, fleshandblood-all]
  schedule:
    - cron: "35 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-cardtrader
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: cardtrader
      game: "fleshandblood"
      affiliate: ${{ vars.CT_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/fleshandblood/fleshandblood.json.xz
    secrets: inherit
