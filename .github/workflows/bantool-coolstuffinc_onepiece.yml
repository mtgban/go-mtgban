name: onepiece / coolstuffinc

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [coolstuffinc_onepiece]
  schedule:
    - cron: "15 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      target: coolstuffinc_onepiece
      game: "onepiece"
      datastore-filepath: b2://mtgban-datastore/onepiece/onepiece.json.xz
    secrets: inherit
