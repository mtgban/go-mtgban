name: riftbound / vegassingles

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-vegassingles, riftbound-all]
  schedule:
    - cron: "21 5,17 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-vegassingles
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: vegassingles
      game: "riftbound"
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
