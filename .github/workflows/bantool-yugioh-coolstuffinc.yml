name: yugioh / coolstuffinc

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [yugioh-coolstuffinc, yugioh-all]
  schedule:
    - cron: "30 2,14 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-coolstuffinc
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: coolstuffinc
      game: "yugioh"
      affiliate: ${{ vars.CSI_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/yugioh/yugioh.json.xz
    secrets: inherit
