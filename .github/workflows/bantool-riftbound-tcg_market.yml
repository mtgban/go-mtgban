name: riftbound / tcg_market

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [riftbound-tcg_market, riftbound-all]
  schedule:
    - cron: "48 2,14 * * *"

permissions:
  contents: read

concurrency:
  group: bantool-tcgplayer
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ github.workflow }}
    uses: ./.github/workflows/run-bantool.yml
    with:
      store: tcg_market
      game: "riftbound"
      affiliate: ${{ vars.TCG_PARTNER }}
      datastore-filepath: b2://mtgban-datastore/riftbound/riftbound.json.xz
    secrets: inherit
