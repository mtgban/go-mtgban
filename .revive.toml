# Style rules the tree already satisfies, so that a regression is caught at
# review time rather than found in a later sweep.
#
# Deliberately absent, each with a reason:
#   var-naming   - 129 exported names still spell an initialism as Id, most of
#                  them struct fields. Fixing them changes what consumers
#                  compile against, so it waits for a version bump. The
#                  unexported half is already done.
#   unnecessary-stmt - its 22 findings are all one-case switches on a card
#                  name. The preprocessors hold 73 of those switches, 54 with
#                  more than one case and the largest with 39: a one-case
#                  block is an edition needing one exception today, not a
#                  different construct.

ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
# Every exported name carries a doc comment now, so the rule can hold that
# line rather than let the next one through. Its stuttering check stays off:
# 21 types still repeat their package name, and renaming those is a version
# bump away.
[rule.exported]
  arguments = ["disableStutteringCheck"]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unnecessary-format]
[rule.unchecked-type-assertion]
[rule.use-any]
[rule.use-errors-new]
[rule.unreachable-code]
[rule.var-declaration]
