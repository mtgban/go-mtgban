# Style rules the tree already satisfies, so that a regression is caught at
# review time rather than found in a later sweep.
#
# Deliberately absent, each with a reason:
#   exported     - 712 exported names still want a doc comment, and 21 types
#                  stutter; both are worth doing, neither is a one-liner.
#   var-naming   - 111 exported names still spell an initialism as Id. Fixing
#                  them changes what consumers compile against, so it waits
#                  for a version bump. The unexported half is already done.
#   use-any      - the empty interface is spelled interface{} throughout, and
#                  the guidance is for new code.

ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unreachable-code]
[rule.var-declaration]
